{% if page.service_name %}
<!-- Service Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ page.service_name | jsonify }},
  "serviceType": {{ page.service_type | jsonify }},
  "provider": { "@id": "https://gloyns.com/#org" },
  "areaServed": ["Australia", "Asia-Pacific"],
  "url": "{{ page.url | absolute_url }}",
  "description": {{ page.service_description | jsonify }}
}
</script>
<!-- Breadcrumb Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "@id": "{{ page.url | absolute_url }}#breadcrumb",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://gloyns.com/" },
    { "@type": "ListItem", "position": 2, "name": "Services", "item": "https://gloyns.com/consulting/" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
  ]
}
</script>
{% endif %}
